# 通用选择
👆 手动选择 = select,PROXY,policy-regex-filter=^(?!.*(剩余|到期|套餐|流量|官网|更新|订阅|Traffic|Expire)).*$,policy-select-name=PROXY
⚡ 自动选择 = url-test,policy-regex-filter=^(?!.*(剩余|到期|套餐|流量|官网|更新|订阅|Traffic|Expire)).*$,url=https://www.gstatic.com/generate_204,interval=600,tolerance=100,timeout=5

# 地区节点组置于底部，按节点名称筛选并自动测延迟。
🇭🇰 香港节点 = url-test,policy-regex-filter=(?i)香港|Hong[ -]?Kong|🇭🇰|(^|[^a-z])HK([^a-z]|$),url=https://www.gstatic.com/generate_204,interval=600,tolerance=100,timeout=5
🇹🇼 台湾节点 = url-test,policy-regex-filter=(?i)台湾|台灣|台北|Taiwan|Taipei|🇹🇼|(^|[^a-z])TW([^a-z]|$),url=https://www.gstatic.com/generate_204,interval=600,tolerance=100,timeout=5
🇯🇵 日本节点 = url-test,policy-regex-filter=(?i)日本|东京|東京|大阪|Japan|Tokyo|Osaka|🇯🇵|(^|[^a-z])JP([^a-z]|$),url=https://www.gstatic.com/generate_204,interval=600,tolerance=100,timeout=5
🇸🇬 新加坡节点 = url-test,policy-regex-filter=(?i)新加坡|狮城|獅城|Singapore|🇸🇬|(^|[^a-z])SG([^a-z]|$),url=https://www.gstatic.com/generate_204,interval=600,tolerance=100,timeout=5
🇰🇷 韩国节点 = url-test,policy-regex-filter=(?i)韩国|韓國|首尔|首爾|Korea|Seoul|🇰🇷|(^|[^a-z])KR([^a-z]|$),url=https://www.gstatic.com/generate_204,interval=600,tolerance=100,timeout=5
🇺🇸 美国节点 = url-test,policy-regex-filter=(?i)美国|美國|洛杉矶|纽约|西雅图|United[ -]?States|America|Los[ -]?Angeles|Seattle|🇺🇸|(^|[^a-z])(US|USA)([^a-z]|$),url=https://www.gstatic.com/generate_204,interval=600,tolerance=100,timeout=5
🇬🇧 英国节点 = url-test,policy-regex-filter=(?i)英国|英國|伦敦|倫敦|United[ -]?Kingdom|Britain|London|🇬🇧|(^|[^a-z])(UK|GB)([^a-z]|$),url=https://www.gstatic.com/generate_204,interval=600,tolerance=100,timeout=5

