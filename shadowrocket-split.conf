# Shadowrocket 分流配置 | 2026-10-14（同步 OpenClash 域名与策略组）
# 需要先导入自己的节点/订阅；全局路由选择“配置”。
# PROXY = 首页当前选中的默认节点；所有国外分组默认使用“👆 手动选择”。
# 分组中的正则会列出已有节点，允许为每项服务固定选择节点。
# 本配置降低 DNS 泄漏风险，不构成 iOS 全系统零泄漏保证。

[General]
# 常规本地解析走加密 DNS-over-PROXY；#proxy 使用首页默认节点。
dns-server = https://1.1.1.1/dns-query#proxy,https://8.8.8.8/dns-query#proxy
# 只有已匹配直连的域名使用国内 DoH，保留国内 CDN 调度。
direct-dns-server = https://223.5.5.5/dns-query,https://223.6.6.6/dns-query
# 备用同样经代理加密查询，不能留空或填写 system。
fallback-dns-server = https://1.1.1.1/dns-query#proxy,https://8.8.8.8/dns-query#proxy
# 此项仅解析节点服务器域名，不能依赖尚未建立的代理连接。
proxy-dns-server = https://223.5.5.5/dns-query,https://223.6.6.6/dns-query
dns-direct-system = false
dns-direct-fallback-proxy = true
hijack-dns = :53
# 不支持代理 UDP 时拒绝，避免偷偷转为直连。
udp-policy-not-supported-behaviour = REJECT
# 保留 UDP/443，Siri/PCC、语音和部分节点协议可能需要它。
block-quic = always-allow
ipv6 = false
prefer-ipv6 = false
bypass-system = false
private-ip-answer = true
use-local-host-item-for-proxy = false
# 不添加 TUN 排除路由或宽泛 skip-proxy，局域网通过下方规则处理。

